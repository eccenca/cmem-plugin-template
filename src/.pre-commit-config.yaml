---
default_language_version:
  python: python3.13

repos:
  - repo: local
    hooks:

      - id: ruff
        name: check:ruff
        entry: task check:ruff
        language: python
        types_or: [python, pyi]
        pass_filenames: false

      - id: uv-lock
        name: uv-lock
        description: run uv lock to update the lock file
        entry: uv lock
        language: python
        pass_filenames: false
        files: ^(.*/)?(uv\.lock|pyproject\.toml)$

      - id: uv-sync
        name: uv-sync
        description: >
          run uv sync to install dependencies from the lock file
        entry: uv sync
        language: python
        pass_filenames: false
        stages: [post-checkout, post-merge]
        always_run: true

      - id: trivy
        name: check:trivy
        description: run trivy to scan for vulnerabilities
        entry: task check:trivy
        language: python
        pass_filenames: false