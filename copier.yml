---
project_type:
    type: str
    help: |

      > project_type:
      > 
      > Which type of project is this?
      >
      > - Plugins are eccenca Corporate Memory Plugins installable with cmemc.
      > - Generic projects are just using the build plan and the config.
      >
    choices:
        eccenca Corporate Memory Plugin: "plugin"
        Generic Python Project: "generic"
    default: plugin

project_slug:
    type: str
    help: |

      > project_slug:
      >
      {% if project_type == 'plugin' -%}
      > Will be used as part of the package name.
      >
      > Example: You enter 'awesome' and the name will be 'cmem-plugin-awesome'.
      {%- else -%}
      > Will be used as package name.
      {%- endif %}
      >
    default: awesome
    validator: >-
        {% if not (project_slug | regex_search('^[a-z][a-z0-9\-]+$')) %}
        project_slug must start with a letter, followed one or more letters, digits or dashes all lowercase.
        {% endif %}

package_name:
    type: str
    when: false
    default: |-
        {% if project_type == 'plugin' -%}
            cmem-plugin-{{ project_slug }}
        {%- else -%}
            {{ project_slug }}
        {%- endif %}

package_dir:
    type: str
    when: false
    default: |-
        {% if project_type == 'plugin' -%}
            cmem_plugin_{{ project_slug | replace("-", "_") }}
        {%- else -%}
            {{ project_slug | replace("-", "_") }}
        {%- endif %}

project_description:
    type: str
    help: |

      > project_description:
      >
      > Will be used as part of the README file and the package info.
      >
      {% if project_type == 'plugin' -%}
      > Use an imperative form to describe what a user can do.
      >
      > Example descriptions can be listed here:
      >     https://pypi.org/search/?q=%22cmem-plugin-%22
      >
      {%- endif %}
    default: Create awesome Knowledge Graphs with eccenca Corporate Memory :-)

author_name:
    type: str
    help: |

      > author_name: Will be used as part of the package info.
      >
    default: eccenca GmbH

author_mail:
    type: str
    help: |

      > author_mail: Will be used as part of the package info.
      >
    default: cmempy-developer@eccenca.com

github_page:
    type: str
    default: ""
    help: |

      > github_page: This URL (e.g. https://github.com/user/repo)
      > will be used as a base for icons and the homepage link in
      > the project toml.
      >
      > It also decides which pipeline is generated. With a URL,
      > you get .github/workflows and the release skill, and no
      > .gitlab-ci.yml. Left blank, you get .gitlab-ci.yml and no
      > .github directory.
      >
      > Leave blank if your project is built on gitlab, even when
      > a github mirror or page exists.
      >

pypi:
    type: bool
    default: false
    help: |

      > pypi: Is this package published on pypi.org?
      >
      > This decides whether the publish path is generated: the
      > github publish workflow, or the manual pypi job of the
      > gitlab pipeline. It also adds badges to the READMEs.
      >
      > Answer yes if the package is on pypi.org, even when you
      > publish it by hand today.
      >

# A support policy, not a technical floor: this template renders with copier
# 8.1 and up, but only 9.x is exercised. See README.md for the requirement.
_min_copier_version: "9.0.0"
_subdirectory: src

# Delivery of the github workflows is gated here rather than by a jinja
# directory name, because dependabot addresses .github/workflows by path and
# rejects a `directory:` containing braces as a glob. See CLAUDE.md.
#
# Setting _exclude replaces copier's defaults - but those are already inactive,
# since copier only applies them when _subdirectory is unset.
_exclude:
    - "{% if not github_page %}.github{% endif %}"
    - "{% if not pypi %}.github/workflows/publish.yml{% endif %}"
