---
version: 2
updates:
  # the template's own CI - never seen by template users
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # the workflows rendered into generated projects
  #
  # the path is the workflow directory itself. The github-actions ecosystem
  # does NOT append '.github/workflows' to a configured directory - pointing
  # this at '/src' finds nothing and fails silently.
  #
  # it must also be a literal path: dependabot rejects a 'directory' containing
  # glob characters, and jinja braces count. Which of these files a generated
  # project receives is therefore decided by _exclude in copier.yml, not by a
  # conditional directory name. Both files keep a plain '.yml' name because
  # dependabot only scans those.
  - package-ecosystem: "github-actions"
    directory: "/src/.github/workflows"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "github"
    groups:
      actions:
        patterns: ["*"]
