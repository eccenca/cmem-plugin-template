---
name: check

# Controls when the workflow will run
# yamllint disable-line rule:truthy
on:
  # Triggers the workflow on push or pull request events
  # but only for the "main" and "develop" branch
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Triggers the workflow on 3am every day
  schedule:
    - cron: '0 3 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency: testing_environment
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Every generated test case runs trivy, so the vulnerability database is
      # worth caching. This step also exists to keep actions/cache in use here:
      # it is the only action in src/.github/workflows that this workflow would
      # otherwise not run, and an unused action is one whose version bumps
      # nothing in this repository ever proves green.
      - name: Cache Trivy DB
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.trivycache
          key: ${{ runner.os }}-trivydb-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-trivydb-

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install and configure poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.4
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: install copier
        run: |
          python3 -m pip install --user copier>=9

      - name: create projects with default answers and run check
        env:
          # absolute, because task check runs trivy from inside each *_dir
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivycache
          CMEM_BASE_URI: ${{ secrets.CMEM_BASE_URI }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          task check

      - name: Publish Test Report in Action
        uses: mikepenz/action-junit-report@v6
        if: always()  # always run even if the previous step fails
        with:
          report_paths: '**/dist/junit-*.xml'

      - name: Publish Test and Coverage Report of ONE test case as PR comment
        uses: xportation/junit-coverage-report@main
        if: github.event_name == 'pull_request'
        with:
          junit-path: plugin_dir/dist/junit-pytest.xml
          coverage-path: plugin_dir/dist/coverage.xml

